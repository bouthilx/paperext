[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperext"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = []
authors = [
  { name = "Satya Ortiz-Gagne", email = "satya.ortiz-gagne@mila.quebec" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "instructor",
  "mlcm",
  "pandas",
  "pydantic",
  "pyyaml",
  "rapidfuzz",
  "rich",
  "scikit-learn",
  "tiktoken",
]
[project.optional-dependencies]
openai = [
  "openai",
]
anthropic = [
  "anthropic",
]
vertexai = [
  "instructor[vertexai]",
  "anthropic[vertex]",
]
# Paperoni's fulltext locator/downloader (arxiv, openreview, mlr, DOI via
# CrossRef/OpenAlex/publisher APIs), used by download-convert. Pinned to a
# commit: paperoni main moves fast and requires Python >= 3.14.
fulltext = [
  "paperoni @ git+https://github.com/mila-iqia/paperoni@6f3f642f40c03f527d37fd7114aa335aca2a8a76",
]

[project.urls]
Documentation = "https://github.com/satyaog/paperext#readme"
Issues = "https://github.com/satyaog/paperext/issues"
Source = "https://github.com/satyaog/paperext"

[project.scripts]
paperoni-report = "paperext.paperoni.report:main"
download-convert = "paperext.download_convert:main"
query = "paperext.query:main"
parse-validation-errors = "paperext.parse_validation_errors:main"
merge-papers = "paperext.merge_papers:main"
backend-check = "paperext.backend_check:main"
categorize = "paperext.categorize.agent:main"
categorize-items = "paperext.categorize.items:main"
categorize-eval = "paperext.categorize.evaluate:main"
categorize-report = "paperext.categorize.report:main"
evaluate = "paperext.evaluate:main"

[tool.hatch.version]
path = "src/paperext/__about__.py"

# The `fulltext` extra pins paperoni to a git commit.
[tool.hatch.metadata]
allow-direct-references = true

# Dev tooling. `uv sync` installs the `dev` group by default; add
# `--all-extras` to get both provider SDKs the test suite imports.
# (The paperoni CLI pins pydantic<2 and cannot share this environment; see
# `download_convert.PAPERONI_SPEC` -- it runs through `uvx` in isolation.)
[dependency-groups]
dev = [
  "pytest",
  "pytest-regressions",
  "mypy>=1.0.0",
  "black~=26.5",
  "isort~=8.0",
]

[tool.black]
target-version = ["py314"]

[tool.coverage.run]
source_pkgs = ["paperext", "tests"]
branch = true
parallel = true
omit = [
  "src/paperext/__about__.py",
]

[tool.coverage.paths]
paperext = ["src/paperext", "*/paperext/src/paperext"]
tests = ["tests", "*/paperext/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
