      behaviors.
    justification: Autonomous-vehicle simulation is the application domain addressed by the proposed method.
    value: autonomous vehicle simulation
  aliases:
  - AV simulation
  - traffic simulation
  role: contributed
- name:
    quote: DJINN is a diffusion model over the joint states of all agents in the scene.
    justification: The work contributes a diffusion-based generative model and conditioning procedures.
