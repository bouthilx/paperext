title:
  quote: A Diffusion-Model of Joint Interactive Navigation
  justification: Title at top of paper.
  value: A Diffusion-Model of Joint Interactive Navigation
description: The paper introduces DJINN, a diffusion model that jointly generates traffic scenarios for all agents in a scene,
  conditioned on a flexible set of observed agent states and map context. It is evaluated on Argoverse and INTERACTION trajectory
  forecasting benchmarks and demonstrates goal-based sampling, behavior-class sampling via classifier guidance, and scenario
  editing.
type:
  quote: On popular trajectory forecasting datasets, we report state of the art performance on joint trajectory metrics.
  justification: Trains and evaluates models on datasets with reported metrics.
  value: empirical
