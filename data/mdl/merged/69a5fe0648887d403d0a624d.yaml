    justification: The paper contributes a method for generating traffic scenarios.
    value: traffic scenario generation
  aliases:
  - traffic scene generation
  role: contributed
- name:
    quote: We evaluate the quality of sampled trajectories with both joint and ego-only motion forecasting
    justification: The paper advances and evaluates joint and ego-only motion forecasting.
    value: trajectory forecasting
  aliases:
  - motion forecasting
  - motion prediction
  role: contributed
- name:
