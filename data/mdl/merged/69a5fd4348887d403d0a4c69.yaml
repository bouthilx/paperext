title:
  quote: 'LLMs and Stack Overflow Discussions: Reliability,

    Impact, and Challenges'
  justification: Title as given on the paper's first page.
  value: 'LLMs and Stack Overflow Discussions: Reliability, Impact, and Challenges'
description: An empirical study that mines Stack Overflow questions before and after ChatGPT's release, prompts ChatGPT-3.5
  and LLaMA-2-7b to answer a sample of them, compares generated answers with accepted human answers via textual (cosine) and
  LLM-judged semantic similarity plus sentiment analysis, and statistically analyses the decline of Stack Overflow posting
  and user activity overall and by domain.
type:
  quote: We conducted an empirical study analyzing questions from Stack Overflow and using these LLMs to address them.
  justification: The paper explicitly describes itself as an empirical study with data mining, prompting and statistical tests.
  value: empirical
research_fields:
- name:
    quote: evaluating the reliability of LLMs in Software Engineering while assisting developers with their daily tasks is
      a relevant and important topic
    justification: The study evaluates LLM reliability in assisting developers, a software engineering concern.
    value: Software Engineering
  aliases:
  - SE
  role: contributed
- name:
    quote: We reinforce previous findings about a decline in posting activity on Stack Overflow, though our results also show
      that such a decline is not uniform on different topics and groups.
    justification: RQ3/RQ4 measure the decline of posting and user activity on Stack Overflow, a claim addressed to the Q&A-community
      literature.
    value: Online Q&A communities
  aliases:
  - Q&A communities
  - Q&A web forums
  role: contributed
- name:
    quote: With the advance of Large Language Models (LLMs), practitioners and researchers have explored the potential of
      leveraging LLMs for different software engineering tasks
    justification: The paper evaluates and compares LLMs and discusses implications for model developers.
    value: Large Language Models
  aliases:
  - LLMs
  role: contributed
- name:
    quote: we mine SO questions using its API from July 2022 till May 2023
    justification: The study mines Stack Overflow posts and user data, a mining software repositories setting.
    value: Mining Software Repositories
  aliases:
  - MSR
  role: used
- name:
    quote: For that, we perform a sentiment analysis of the generated answers.
    justification: NLP methods including embeddings and sentiment analysis are used to evaluate answer text.
    value: Natural Language Processing
  aliases:
  - NLP
  role: used
