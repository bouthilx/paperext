title:
  quote: 'G RAPH T EXT: G RAPH R EASONING IN T EXT S PACE'
  justification: Title from header
  value: 'GraphText: Graph Reasoning in Text Space'
description: Proposes GraphText, which turns a graph into natural language through a graph-syntax tree so an LLM can treat
  node classification as text generation; evaluated training-free with ChatGPT/GPT-4 in-context learning and by instruction-tuning
  Llama-2-7B, against GNN baselines (GCN, GAT, GCNII, GATv2) trained on citation and WebKB graphs.
type:
  quote: We conduct extensive experiments to demonstrate the effectiveness of G RAPH T EXT.
  justification: The paper proposes a framework and evaluates it empirically on benchmark datasets.
  value: empirical
research_fields:
- name:
    quote: LLMs have not made significant advancements in the realm of graph machine learning
    justification: The paper advances graph machine learning via LLMs.
    value: Graph Machine Learning
  aliases:
  - graph ML
  role: contributed
- name:
    quote: perform graph reasoning in text space
    justification: The proposed framework directly advances graph reasoning using natural-language representations.
    value: graph reasoning
  aliases: []
  role: contributed
- name:
    quote: Large Language Models (LLMs) have gained the ability to assimilate human knowledge and facilitate natural language
      interactions
    justification: The work is on LLM/NLP methods (text space reasoning, prompting, instruction tuning).
    value: Natural Language Processing
  aliases:
  - NLP
  role: used
- name:
    quote: we demonstrate this capability on the node classification tasks
    justification: Node classification is the evaluation task setting.
    value: Node Classification
  aliases: []
  role: used
