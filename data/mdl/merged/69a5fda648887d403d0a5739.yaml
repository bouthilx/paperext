title:
  quote: 'PhotoBot: Reference-Guided Interactive Photography via Natural Language'
  justification: Title as given on the paper
  value: 'PhotoBot: Reference-Guided Interactive Photography via Natural Language'
description: The paper presents PhotoBot, a robotic photography framework that uses a VLM and object detector to caption a
  curated gallery of reference images, an LLM to retrieve relevant references from a user's natural language query, and DINO-ViT
  semantic correspondences with a PnP solver (MAGSAC++/RANSAC) to adjust an RGB-D camera mounted on a Franka Emika manipulator.
  User studies and ablations on RANSAC thresholds and number of keypoints are reported.
type:
  quote: We demonstrate our approach using a manipulator equipped with a wrist camera. Our user studies show that photos taken
    by PhotoBot are often more aesthetically pleasing than those taken by users themselves
  justification: The work builds a system and evaluates it with real robot experiments and user studies.
  value: empirical
